  <div id="loading">
    <style>

  <script>
    (function() {
      console.log("LUXO Voice Recorder initialized");
      const serverBaseUrl = window.location.protocol + "//" + window.location.host;
      let mediaRecorder;
      let audioChunks = [];
      let isRecording = false;
      let streamRef = null;
      
      let recognition = null;
      let isListeningWakeWord = false;

      let sharedAudioCtx = null;
      function getAudioContext() {
        if (!sharedAudioCtx || sharedAudioCtx.state === 'closed') {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) sharedAudioCtx = new AudioContext();
        }
        if (sharedAudioCtx && sharedAudioCtx.state === 'suspended') {
          sharedAudioCtx.resume().catch(() => {});
        }
        return sharedAudioCtx;
      }
      document.addEventListener('click', () => { getAudioContext(); }, { once: false });
      document.addEventListener('keydown', () => { getAudioContext(); }, { once: false });

      function playBeep(type) {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;

          function emitTone(freq, duration, delayMs) {
            setTimeout(() => {
              try {
                if (ctx.state === 'suspended') ctx.resume().catch(() => {});
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.20, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
              } catch(e){}
            }, delayMs);
          }

          if (type === 2) {
            // EXACTAMENTE 2 BEEPS al terminar la frase (beep-beep de confirmación)
            emitTone(1050, 0.08, 0);
            emitTone(1400, 0.12, 100);
          } else {
            // EXACTAMENTE 1 BEEP al decir "Oye LUXO" (tono único de atención)
            emitTone(880, 0.13, 0);
          }
        } catch (e) {
          console.error("Error playing beep:", e);
        }
      }

      let isAccumulating = false;
      let questionBuffer = "";
      let sendTimeout = null;
      let wakeTimeout = null;
      let matchedResultIndex = -1;
      let matchedTriggerPhrase = "";

      function injectTextIntoDomAndSend(text) {
        if (!text) return false;
        try {
          const inputs = Array.from(document.querySelectorAll('textarea, input[type="text"]'));
          let chatInput = null;
          
          for (const inp of inputs) {
            const placeholder = (inp.getAttribute('placeholder') || '').toLowerCase();
            const hint = (inp.getAttribute('aria-label') || '').toLowerCase();
            if (placeholder.includes('consulta') || placeholder.includes('escribe') || hint.includes('consulta') || hint.includes('escribe')) {
              chatInput = inp;
              break;
            }
          }
          
          if (!chatInput) {
            chatInput = inputs.find(inp => inp.tagName.toLowerCase() === 'textarea' || (inp.offsetParent !== null && inp.offsetHeight > 25));
          }

          if (chatInput) {
            chatInput.focus();
            const nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, "value")?.set || Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value")?.set;
            if (nativeInputValueSetter) {
              nativeInputValueSetter.call(chatInput, text);
            } else {
              chatInput.value = text;
            }
            
            chatInput.dispatchEvent(new Event('input', { bubbles: true }));
            chatInput.dispatchEvent(new Event('change', { bubbles: true }));

            const enterDown = new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true, cancelable: true });
            const enterUp = new KeyboardEvent('keyup', { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true, cancelable: true });
            chatInput.dispatchEvent(enterDown);
            chatInput.dispatchEvent(enterUp);

            return true;
          }
        } catch(e) {
          console.error("Error al inyectar texto en el DOM:", e);
        }
        return false;
      }

      async function sendTextInput(userId, text) {
        try {
          const uid = (userId && userId !== "unknown") ? userId : "1";
          const url = `${serverBaseUrl}/text_input?user_id=${encodeURIComponent(uid)}&text=${encodeURIComponent(text)}`;
          await fetch(url, { method: 'POST' });
        } catch (err) {
          console.error("Error al enviar comando de voz:", err);
        }
      }

      function sendAccumulatedQuestion() {
        if (!isAccumulating) return;
        const currentUserId = getUserId();
        const finalQuestion = questionBuffer.trim();
        
        if (finalQuestion) {
          isAccumulating = false;
          matchedResultIndex = -1;
          matchedTriggerPhrase = "";
          questionBuffer = "";
          if (wakeTimeout) clearTimeout(wakeTimeout);
          
          playBeep(2);
          if (typeof window.showLuxoSiriOrb === 'function') window.showLuxoSiriOrb(4000);
          console.log("🚀 ¡Enviando pregunta final a LUXO!", finalQuestion, "Usuario:", currentUserId);
          injectTextIntoDomAndSend(finalQuestion);
          sendTextInput(currentUserId, finalQuestion);
        }
      }

      function getUserId() {
        try {
          const domInput = document.querySelector('input[placeholder="USER_ID_HINT"]') || document.querySelector('textarea[placeholder="USER_ID_HINT"]');
          if (domInput && domInput.value && !["unknown", "", "null", "undefined"].includes(String(domInput.value).toLowerCase())) {
            window.luxoUserId = String(domInput.value);
            return String(domInput.value);
          }
        } catch(e){}
        if (typeof window.getLuxoUserId === "function") {
          const uid = window.getLuxoUserId();
          if (uid && !["unknown", "", "null", "undefined"].includes(String(uid).toLowerCase())) {
            return String(uid);
          }
        }
        if (window.luxoUserId && !["unknown", "", "null", "undefined"].includes(String(window.luxoUserId).toLowerCase())) {
          return String(window.luxoUserId);
        }
        if (window.currentUserId && !["unknown", "", "null", "undefined"].includes(String(window.currentUserId).toLowerCase())) {
          return String(window.currentUserId);
        }
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.includes("logged_user_id") || key === "luxo_user_id")) {
            try {
              const val = localStorage.getItem(key);
              if (val) {
                const parsed = JSON.parse(val);
                if (parsed && !["unknown", "", "null", "undefined"].includes(String(parsed).toLowerCase())) {
                  return String(parsed);
                }
              }
            } catch(e) {
              const val = localStorage.getItem(key);
              if (val && !["unknown", "", "null", "undefined"].includes(String(val).toLowerCase())) {
                return String(val).replace(/["']/g, "");
              }
            }
          }
        }
        if (typeof window.getLuxoUsername === "function") {
          const uname = window.getLuxoUsername();
          if (uname && !["unknown", "", "null", "undefined"].includes(String(uname).toLowerCase())) {
            return String(uname);
          }
        }
        if (typeof window.getLuxoSessionId === "function") {
          const sid = window.getLuxoSessionId();
          if (sid && !["unknown", "", "null", "undefined"].includes(String(sid).toLowerCase())) {
            return String(sid);
          }
        }
        return "1";
      }

      function startSpeechRecognition() {
        // Detección estricta de dispositivo móvil/tablet para no iniciar escucha continua en segundo plano
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        const isDesktopOS = /Windows NT|Macintosh|Linux x86_64/i.test(navigator.userAgent);
        const isMobileDevice = isTouchDevice || ((/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Tablet/i.test(navigator.userAgent)) && !isDesktopOS);

        if (isMobileDevice) {
          console.log("📱 [Luxo WakeWord]: Dispositivo móvil detectado. 'Oye LUXO' automático desactivado.");
          return;
        }

        if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
          console.warn("Este navegador no soporta Reconocimiento de Voz para palabra de activación.");
          return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.lang = 'es-MX';

        recognition.onstart = () => {
          console.log("Escucha activa iniciada. Di 'Oye Luxo...'");
          isListeningWakeWord = true;
        };

        recognition.onresult = async (event) => {
          if (isRecording) return;
          const currentUserId = getUserId();

          for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
              const rawTranscript = event.results[i][0].transcript.trim();
              const transcript = rawTranscript.toLowerCase().trim();
              console.log("Texto escuchado:", rawTranscript);

              const triggers = [
                "oye luxo", "oye luxó", "oye lujo", "oye luso", "oye lux", "oye luxe",
                "oye look so", "oye look", "oye lucso", "oye luco", "oye lucio", "oye luyo",
                "oye buxo", "oye bujo", "oye flujo", "oye flux", "oye lusso",
                "hola luxo", "hola lujo", "hola luso", "hola lux", "hola luxe", "hola look",
                "hey luxo", "hey lujo", "hey luso", "hey lux",
                "ok luxo", "ok lujo", "ok luso",
                "oiga luxo", "oiga lujo",
                "hoy el uso", "oye el uso", "oye luz o", "oye ruso", "hoy en luxo", "hoy luxo", "oí luxo", "oí lujo"
              ];

              let matchedTrigger = null;
              let idx = -1;
              
              for (const trg of triggers) {
                const tempIdx = transcript.indexOf(trg);
                if (tempIdx !== -1) {
                  if (idx === -1 || tempIdx < idx) {
                    idx = tempIdx;
                    matchedTrigger = trg;
                  }
                }
              }

              if (idx !== -1 && matchedTrigger) {
                playBeep(1);
                if (typeof window.showLuxoSiriOrb === 'function') {
                  window.showLuxoSiriOrb(8000);
                }
                if (currentUserId && currentUserId !== "unknown") {
                  fetch(serverBaseUrl + '/luxo_listening_start?user_id=' + currentUserId, { method: 'POST' }).catch(() => {});
                }
                
                isAccumulating = true;
                questionBuffer = "";
                
                let question = rawTranscript.substring(idx + matchedTrigger.length).trim();
                question = question.replace(/^[,\?¿\.\s]+/, '').trim();
                if (question) {
                  questionBuffer = question;
                }
                
                if (sendTimeout) clearTimeout(sendTimeout);
                if (wakeTimeout) clearTimeout(wakeTimeout);
                
                if (questionBuffer) {
                  sendTimeout = setTimeout(sendAccumulatedQuestion, 800);
                } else {
                  wakeTimeout = setTimeout(() => {
                    isAccumulating = false;
                    console.log("Tiempo de espera para pregunta agotado (10s).");
                  }, 10000);
                }
                console.log("¡Palabra clave detectada!", matchedTrigger, "Buffer inicial:", questionBuffer);
              } else if (isAccumulating) {
                let segmentText = rawTranscript.replace(/^[,\?¿\.\s]+/, '').trim();
                if (segmentText) {
                  if (wakeTimeout) {
                    clearTimeout(wakeTimeout);
                    wakeTimeout = null;
                  }
                  questionBuffer += (questionBuffer ? " " : "") + segmentText;
                }
                
                if (sendTimeout) clearTimeout(sendTimeout);
                sendTimeout = setTimeout(sendAccumulatedQuestion, 800);
                console.log("¡Fragmento acumulado! Buffer actual:", questionBuffer);
              }
            }
          }
        };

        window.pausarReconocimientoGlobal = function() {
          window._simuladorActivo = true;
          isListeningWakeWord = false;
          if (recognition) {
            try { 
              if (typeof recognition.abort === "function") recognition.abort();
              else if (typeof recognition.stop === "function") recognition.stop();
            } catch(e){}
          }
        };

        window.reanudarReconocimientoGlobal = function() {
          window._simuladorActivo = false;
          setTimeout(() => {
            if (recognition && !isListeningWakeWord && !isRecording && !window._simuladorActivo) {
              try { recognition.start(); } catch(e){}
            }
          }, 800);
        };

        recognition.onerror = (e) => {
          if (e.error !== 'no-speech') {
            console.log("Estado reconocimiento de voz:", e.error);
          }
        };

        recognition.onend = () => {
          isListeningWakeWord = false;
          setTimeout(() => {
            if (!isListeningWakeWord && !isRecording && !window._simuladorActivo) {
              try {
                recognition.start();
              } catch(err) {}
            }
          }, 250);
        };

        try {
          recognition.start();
        } catch(err) {
          console.error("Error al iniciar reconocimiento:", err);
        }
      }

      async function pollCommand() {
        const currentUserId = getUserId();
        if (currentUserId === "unknown") return;

        try {
          const response = await fetch(`${serverBaseUrl}/command?user_id=${currentUserId}`);
          if (!response.ok) return;
          const data = await response.json();
          const cmd = data.command;
          
          if (cmd === "START" && !isRecording) {
            let wasActive = false;
            // Detener temporalmente el reconocimiento pasivo
            if (recognition && isListeningWakeWord) {
              try { recognition.stop(); } catch(e){}
              isListeningWakeWord = false;
              wasActive = true;
            }

            const startRecordingFlow = () => {
              const isMicSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
              if (!isMicSupported) {
                console.warn("MediaDevices no soportado (insecure HTTP context)");
                fetch(`${serverBaseUrl}/status?user_id=${currentUserId}&state=NOT_SUPPORTED`);
                return;
              }
              
              console.log("Iniciando grabación en JS...");
              navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                streamRef = stream;
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = e => {
                  audioChunks.push(e.data);
                };
                
                mediaRecorder.onstop = async () => {
                  console.log("Grabación detenida en JS. Subiendo...");
                  const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                  const formData = new FormData();
                  formData.append('file', audioBlob, 'voice.wav');
                  
                  const uploadUrl = `${serverBaseUrl}/upload?user_id=${currentUserId}`;
                  
                  try {
                    const res = await fetch(uploadUrl, {
                      method: 'POST',
                      body: formData
                    });
                    if (res.ok) {
                      console.log("Subida exitosa!");
                    } else {
                      console.error("Fallo de subida:", res.status);
                      fetch(`${serverBaseUrl}/status?user_id=${currentUserId}&state=ERROR`);
                    }
                  } catch (err) {
                    console.error("Error al subir:", err);
                    fetch(`${serverBaseUrl}/status?user_id=${currentUserId}&state=ERROR`);
                  }

                  // Reactivar reconocimiento pasivo después de subir
                  setTimeout(() => {
                    if (recognition && !isListeningWakeWord && !isRecording) {
                      try { recognition.start(); } catch(e){}
                    }
                  }, 1000);
                };
                
                mediaRecorder.start();
                isRecording = true;
                
                fetch(`${serverBaseUrl}/status?user_id=${currentUserId}&state=RECORDING`);
              }).catch(err => {
                console.error("Error de acceso al micrófono:", err);
                alert("Permiso de micrófono denegado: " + err.message);
                fetch(`${serverBaseUrl}/status?user_id=${currentUserId}&state=ERROR`);
                
                // Reactivar en caso de error
                setTimeout(() => {
                  if (recognition && !isListeningWakeWord && !isRecording) {
                    try { recognition.start(); } catch(e){}
                  }
                }, 1000);
              });
            };

            if (wasActive) {
              // Esperar 800ms para liberar el micrófono
              setTimeout(startRecordingFlow, 800);
            } else {
              startRecordingFlow();
            }
          } else if (cmd === "STOP" && isRecording) {
            console.log("Deteniendo grabación en JS...");
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
              mediaRecorder.stop();
            }
            if (streamRef) {
              streamRef.getTracks().forEach(t => t.stop());
            }
            isRecording = false;
          }
        } catch (err) {
          // Ignore network errors
        }
      }

      let isPollingCommand = false;
      async function safePollLoop() {
        if (!isPollingCommand) {
          isPollingCommand = true;
          try {
            await pollCommand();
          } catch(e) {}
          isPollingCommand = false;
        }
        const delay = document.hidden ? 3000 : 1200;
        setTimeout(safePollLoop, delay);
      }
      setTimeout(safePollLoop, 1500);
      console.log("Bucle de consulta de comandos registrado exitosamente!");
      
      // Iniciar la escucha continua en segundo plano
      setTimeout(startSpeechRecognition, 2000);
    })();
  </script>
