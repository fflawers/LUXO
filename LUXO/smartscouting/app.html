<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartScouting · Simulador de Márgenes</title>
<script src="vendor/react.min.js"></script>
<script src="vendor/react-dom.min.js"></script>
<script src="vendor/prop-types.min.js"></script>
<script>window.react=window.React;window.reactDom=window.ReactDOM;</script>
<script src="vendor/recharts.min.js"></script>
<script src="vendor/lucide-react.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="dark"]{
--bg:#0D0F14;--s1:#161922;--s2:#1E2330;--s3:#252B3B;
--border:rgba(255,255,255,0.07);--border-s:rgba(255,255,255,0.13);
--t1:#F0F2F8;--t2:#A8B3CC;--t3:#6B7280;--t4:#3D4556;
--shadow:0 2px 12px rgba(0,0,0,.4);--tbl-hover:rgba(255,255,255,0.02);
}
[data-theme="light"]{
--bg:#F4F6FA;--s1:#FFFFFF;--s2:#F0F2F8;--s3:#E4E8F0;
--border:rgba(0,0,0,0.07);--border-s:rgba(0,0,0,0.13);
--t1:#0F1623;--t2:#3D4A60;--t3:#6B7890;--t4:#A8B3CC;
--shadow:0 2px 12px rgba(0,0,0,.1);--tbl-hover:rgba(0,0,0,0.02);
}
:root,[data-theme="dark"],[data-theme="light"]{
--accent:#00D084;--ac-dim:rgba(0,208,132,0.12);--ac-b:rgba(0,208,132,0.3);
--warn:#F59E0B;--wn-dim:rgba(245,158,11,0.12);--wn-b:rgba(245,158,11,0.3);
--danger:#EF4444;--dn-dim:rgba(239,68,68,0.12);--dn-b:rgba(239,68,68,0.3);
--pro:#7C3AED;--pr-dim:rgba(124,58,237,0.12);--pr-b:rgba(124,58,237,0.3);
--ml:#FACC15;--amz:#F97316;--wal:#3B82F6;
--mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;--r:8px;
}
html{background:var(--bg);color:var(--t1);font-family:var(--sans);transition:background .2s,color .2s;}
body{min-height:100vh;}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type="number"]{-moz-appearance:textfield;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--s1);}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:99px;}
.card{background:var(--s1);border:0.5px solid var(--border);border-radius:12px;transition:background .2s,border-color .2s;}
.fw{display:flex;align-items:center;background:var(--s2);border:0.5px solid var(--border-s);border-radius:var(--r);overflow:hidden;transition:border-color .15s,background .2s;}
.fw:focus-within{border-color:var(--ac-b);}
.fw input{flex:1;border:none;background:transparent;padding:0 10px;height:36px;font-size:13px;color:var(--t1);outline:none;min-width:0;width:0;font-family:var(--mono);}
.fw input::placeholder{color:var(--t4);font-family:var(--sans);}
.fw input[type=text]{font-family:var(--sans);}
.fpre,.fsuf{padding:0 10px;font-size:12px;color:var(--t3);background:var(--s3);height:36px;display:flex;align-items:center;flex-shrink:0;font-family:var(--mono);transition:background .2s;}
.fpre{border-right:0.5px solid var(--border);}
.fsuf{border-left:0.5px solid var(--border);}
.seg{display:flex;border:0.5px solid var(--border-s);border-radius:var(--r);overflow:hidden;}
.seg button{flex:1;border:none;background:transparent;font-size:12px;font-weight:600;cursor:pointer;color:var(--t3);padding:0 12px;height:36px;transition:background .15s,color .15s;white-space:nowrap;font-family:var(--sans);}
.seg button.on{background:var(--t1);color:var(--bg);}
.lbl{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:flex;align-items:center;gap:5px;}
.sec-ttl{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;padding-bottom:8px;border-bottom:0.5px solid var(--border);margin-bottom:12px;}
.badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;display:inline-block;}
.b-win{background:rgba(0,208,132,.15);color:var(--accent);border:0.5px solid var(--ac-b);}
.b-low{background:var(--wn-dim);color:var(--warn);border:0.5px solid var(--wn-b);}
.b-los{background:var(--dn-dim);color:var(--danger);border:0.5px solid var(--dn-b);}
.gt{height:5px;background:var(--s3);border-radius:99px;overflow:hidden;flex:1;}
.gf{height:100%;border-radius:99px;transition:width .4s ease,background .4s ease;}
.pc{background:var(--s1);border:0.5px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:background .2s,border-color .2s;}
.pc.win{border-color:var(--ac-b);}
.pc.los{border-color:var(--dn-b);}
.ph{padding:10px 14px;background:var(--s2);border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:10px;transition:background .2s;}
.pl{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;}
.pb{padding:12px 14px;flex:1;display:flex;flex-direction:column;}
.bn{font-size:22px;font-weight:700;font-family:var(--mono);letter-spacing:-0.03em;}
.fr{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:0.5px solid var(--border);}
.fr:last-child{border-bottom:none;}
.fr.tot{border-top:0.5px solid var(--border-s);border-bottom:none;padding-top:8px;margin-top:4px;}
.fv{font-size:11px;font-family:var(--mono);color:var(--t1);}
.fv.neg{color:var(--danger);}
.fv.pos{color:var(--accent);}
.fl{font-size:11px;color:var(--t3);}
.tbl{width:100%;border-collapse:collapse;font-size:11px;}
.tbl th{padding:9px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);background:var(--s2);border-bottom:0.5px solid var(--border);text-align:left;white-space:nowrap;transition:background .2s;}
.tbl td{padding:9px 12px;border-bottom:0.5px solid var(--border);color:var(--t2);vertical-align:middle;transition:background .2s;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--tbl-hover);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:34px;border-radius:var(--r);font-size:11px;font-weight:700;cursor:pointer;border:none;text-transform:uppercase;letter-spacing:.05em;transition:opacity .15s,transform .1s;font-family:var(--sans);}
.btn:hover{opacity:.85;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.bp{background:var(--accent);color:#0D0F14;}
.bg{background:var(--s2);color:var(--t2);border:0.5px solid var(--border-s);}
.bd{background:var(--dn-dim);color:var(--danger);border:0.5px solid var(--dn-b);}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.md{background:var(--s1);border:0.5px solid var(--border-s);border-radius:16px;width:100%;max-width:760px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;}
.mh{padding:16px 20px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.mb{flex:1;overflow-y:auto;padding:20px;}
/* configuracion en solo lectura para el equipo de scouting */
.md.solo-lectura .mb input,.md.solo-lectura .mb select,.md.solo-lectura .mb textarea{pointer-events:none;opacity:.7;}
.md.solo-lectura .mb .btn,.md.solo-lectura .mb label.btn{display:none;}
.md.solo-lectura .mb::before{content:'Solo lectura. Estos valores los define el administrador; aquí puedes consultarlos pero no modificarlos.';display:block;background:var(--wn-dim);border:0.5px solid var(--wn-b);color:var(--warn);border-radius:10px;padding:11px 14px;font-size:11.5px;line-height:1.55;font-weight:500;margin-bottom:16px;}
.tb{display:flex;gap:4px;padding:4px;background:var(--s2);border-radius:var(--r);}
.tbb{flex:1;padding:6px 14px;border:none;background:transparent;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;color:var(--t3);transition:background .15s,color .15s;font-family:var(--sans);}
.tbb.on{background:var(--s1);color:var(--t1);}
.ism{width:100%;background:var(--s2);border:0.5px solid var(--border-s);border-radius:var(--r);padding:6px 10px;font-size:12px;color:var(--t1);outline:none;font-family:var(--mono);transition:border-color .15s,background .2s;}
.ism:focus{border-color:var(--ac-b);}
.cr{display:grid;gap:8px;padding:8px 12px;background:var(--s1);border:0.5px solid var(--border);border-radius:var(--r);align-items:center;margin-bottom:4px;transition:border-color .15s,background .2s;}
.cr:hover{border-color:var(--border-s);}
.sp{width:36px;height:36px;border:3px solid var(--s3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.mts{display:flex;background:var(--s3);border-radius:6px;padding:2px;gap:2px;}
.mtb{flex:1;border:none;background:transparent;font-size:10px;font-weight:700;cursor:pointer;color:var(--t3);padding:5px 10px;border-radius:4px;text-transform:uppercase;transition:background .15s,color .15s;font-family:var(--sans);}
.mtb.on{background:var(--s1);color:var(--t1);}
.sel{background:var(--s2);border:0.5px solid var(--border-s);border-radius:var(--r);padding:0 10px;height:36px;font-size:12px;color:var(--t1);outline:none;font-family:var(--sans);width:100%;cursor:pointer;transition:background .2s,color .2s;}
.sel option{background:var(--s1);}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r);cursor:pointer;font-size:12px;font-weight:600;color:var(--t3);transition:background .15s,color .15s;border:none;background:transparent;font-family:var(--sans);}
.nav-item:hover{background:var(--s2);color:var(--t2);}
.nav-item.active{background:var(--ac-dim);color:var(--accent);}
.kpi-card{background:var(--s1);border:0.5px solid var(--border);border-radius:12px;padding:16px 18px;transition:background .2s;}
.kpi-val{font-size:26px;font-weight:800;font-family:var(--mono);letter-spacing:-0.03em;margin:4px 0 2px;}
.filter-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;cursor:pointer;border:0.5px solid var(--border-s);background:var(--s2);color:var(--t3);transition:all .15s;text-transform:uppercase;letter-spacing:.04em;}
.filter-chip.active{background:var(--ac-dim);border-color:var(--ac-b);color:var(--accent);}
.sort-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--r);font-size:10px;font-weight:700;cursor:pointer;border:0.5px solid var(--border-s);background:transparent;color:var(--t3);transition:all .15s;text-transform:uppercase;font-family:var(--sans);}
.sort-btn.active{color:var(--accent);border-color:var(--ac-b);}
.tc-pill{display:flex;align-items:stretch;background:var(--s2);border:0.5px solid var(--border-s);border-radius:var(--r);height:36px;overflow:hidden;transition:background .2s;}
.tc-seg{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 11px;}
.tc-seg-hd{display:flex;align-items:center;gap:5px;font-size:8.5px;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.09em;line-height:1;}
.tc-seg-bd{display:flex;align-items:baseline;gap:3px;}
.tc-val{font-size:13px;font-weight:800;font-family:var(--mono);color:var(--t1);line-height:1.1;letter-spacing:-.02em;}
.tc-val.warn{color:var(--warn);}
.tc-cur{font-size:8.5px;font-weight:700;color:var(--t4);}
.tc-mut{font-size:10px;color:var(--t4);font-family:var(--sans);line-height:1.3;}
.tc-div{width:0.5px;background:var(--border-s);flex-shrink:0;}
.tc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.tc-dot.ok{background:var(--accent);}
.tc-dot.loading{background:var(--warn);animation:pulse 1s ease-in-out infinite;}
.tc-dot.error{background:var(--t4);}
.tc-dot.idle{background:var(--t4);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
/* theme toggle con icono */
.theme-btn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:var(--r);border:0.5px solid var(--border-s);background:var(--s2);cursor:pointer;color:var(--t3);font-size:11px;font-weight:600;font-family:var(--sans);transition:background .15s,color .15s,border-color .15s;}
.theme-btn:hover{background:var(--s3);color:var(--t1);}
[data-theme="light"] .theme-btn{border-color:rgba(0,0,0,.15);}
/* selection bar */
.sel-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s1);border:0.5px solid var(--border-s);border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);z-index:80;animation:slideUp .2s ease;white-space:nowrap;}
@keyframes slideUp{from{transform:translateX(-50%) translateY(10px);opacity:0;}to{transform:translateX(-50%) translateY(0);opacity:1;}}
/* barra de filtros por secciones */
.toolbar{background:var(--s1);border:0.5px solid var(--border);border-radius:12px;margin-bottom:12px;transition:background .2s;overflow:hidden;}
.tb-sec{padding:12px 16px;border-bottom:0.5px solid var(--border);}
.tb-sec:last-child{border-bottom:none;}
.tb-sec-hd{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.11em;margin-bottom:9px;}
.tb-row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;}
.tb-field{display:flex;flex-direction:column;gap:5px;min-width:0;}
.tb-field>label{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;}
.tb-sep{width:0.5px;align-self:stretch;background:var(--border);margin:0 2px;}
.more-btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:var(--r);border:0.5px solid var(--border-s);background:var(--s2);color:var(--t2);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:background .15s,color .15s,border-color .15s;}
.more-btn:hover{background:var(--s3);color:var(--t1);}
.more-btn.on{background:var(--ac-dim);border-color:var(--ac-b);color:var(--accent);}
.more-btn .cnt{min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--accent);color:#0D0F14;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.chips-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 16px;background:var(--s2);}
.chip-act{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:99px;font-size:10px;font-weight:600;background:var(--ac-dim);border:0.5px solid var(--ac-b);color:var(--accent);}
.chip-act button{background:none;border:none;cursor:pointer;color:inherit;display:flex;padding:0;opacity:.7;}
.chip-act button:hover{opacity:1;}
.seg-sm{display:flex;border:0.5px solid var(--border-s);border-radius:var(--r);overflow:hidden;height:34px;}
.seg-sm button{border:none;background:transparent;font-size:11px;font-weight:600;cursor:pointer;color:var(--t3);padding:0 12px;transition:background .15s,color .15s;white-space:nowrap;font-family:var(--sans);}
.seg-sm button:hover{background:var(--s2);color:var(--t2);}
.seg-sm button.on{background:var(--ac-dim);color:var(--accent);}
th.sortable{cursor:pointer;user-select:none;transition:color .15s;}
th.sortable:hover{color:var(--t1);}
th.sortable.on{color:var(--accent);}
.th-in{display:inline-flex;align-items:center;gap:4px;}
.th-ar{opacity:0;transition:opacity .15s;}
th.sortable:hover .th-ar{opacity:.45;}
th.sortable.on .th-ar{opacity:1;}
.res-count{font-size:11px;color:var(--t3);white-space:nowrap;}
.res-count strong{color:var(--t1);font-family:var(--mono);}
/* conversion dentro del campo, sin mover el diseno */
.fsuf.conv{color:var(--accent);background:var(--ac-dim);font-weight:600;white-space:nowrap;}
/* barra de sesion */
.user-pill{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-radius:var(--r);background:var(--s2);border:0.5px solid var(--border-s);}
.rol-tag{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:2px 5px;border-radius:4px;}
.rol-tag.admin{background:rgba(245,158,11,.12);color:var(--warn);border:0.5px solid rgba(245,158,11,.3);}
.rol-tag.scouting{background:var(--ac-dim);color:var(--accent);border:0.5px solid var(--ac-b);}
/* barra superior por grupos */
.tb-grupo{display:flex;align-items:center;height:34px;background:var(--s2);border:0.5px solid var(--border-s);border-radius:var(--r);overflow:hidden;}
.tb-grupo.cuenta{background:transparent;border-color:transparent;gap:0;}
.tb-gdiv{width:0.5px;height:18px;background:var(--border-s);flex-shrink:0;}
.tb-btn{display:inline-flex;align-items:center;gap:7px;height:33px;padding:0 12px;border:none;background:transparent;color:var(--t2);font-size:11px;font-weight:600;font-family:var(--sans);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;}
.tb-btn:hover{background:var(--s3);color:var(--t1);}
.tb-btn.tb-icon{padding:0 11px;}
.tb-btn.salir:hover{background:var(--dn-dim);color:#FCA5A5;}
.tb-grupo.cuenta .user-pill{border:none;background:var(--s2);border-radius:var(--r) 0 0 var(--r);}
.tb-grupo.cuenta .tb-btn{background:var(--s2);}
.tb-grupo.cuenta{border:0.5px solid var(--border-s);border-radius:var(--r);}
.volver{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r);background:var(--s2);border:0.5px solid var(--border-s);color:var(--t2);font-size:11px;font-weight:600;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s;}
.volver:hover{background:var(--s3);color:var(--t1);}
.panel-link:hover{background:var(--s3);color:var(--t1);}
/* distintivo de modo local */
#modo-local{position:fixed;right:14px;bottom:14px;z-index:300;display:flex;align-items:center;gap:7px;
  background:rgba(245,158,11,.12);border:0.5px solid rgba(245,158,11,.3);color:#F59E0B;
  border-radius:99px;padding:6px 13px;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  font-family:'Inter',sans-serif;text-transform:uppercase;cursor:help;backdrop-filter:blur(6px);}
#modo-local span{width:6px;height:6px;border-radius:50%;background:#F59E0B;}
.aviso-db{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;background:var(--dn-dim);border:0.5px solid var(--dn-b);color:#FCA5A5;border-radius:10px;padding:11px 16px;font-size:11.5px;max-width:520px;line-height:1.5;box-shadow:0 12px 34px rgba(0,0,0,.5);}
.user-av{width:22px;height:22px;border-radius:50%;background:var(--ac-dim);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;}
/* panel de resultado destacado */
.res-box{margin-top:13px;padding:12px 14px;border-radius:10px;background:var(--ac-dim);border:0.5px solid var(--ac-b);transition:background .2s,border-color .2s;}
.res-box.neg{background:var(--dn-dim);border-color:var(--dn-b);}
.res-box.idle{background:var(--s2);border-color:var(--border);}
.res-main{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.res-lbl{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;}
.res-num{font-size:26px;font-weight:800;font-family:var(--mono);letter-spacing:-.03em;line-height:1;color:var(--accent);}
.res-box.neg .res-num{color:var(--danger);}
.res-box.idle .res-num{color:var(--t4);}
.res-sub{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:9px;padding-top:9px;border-top:0.5px solid var(--border);}
.res-sub-l{font-size:11px;font-weight:500;color:var(--t3);}
.res-sub-v{font-size:15px;font-weight:700;font-family:var(--mono);color:var(--accent);letter-spacing:-.02em;}
.res-sub-v.neg{color:var(--danger);}
.res-box.idle .res-sub-v{color:var(--t4);}
