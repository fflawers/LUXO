version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: luxo_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: los4valtierra
      MYSQL_DATABASE: sgh_portal
    volumes:
      # Este mapeo permite que el respaldo SQL se ejecute y restaure automáticamente 
      # cuando el contenedor se levante por primera vez.
      - ./respaldo_base_de_datos_luxo.sql:/docker-entrypoint-initdb.d/dump.sql
      # Persistencia de datos (opcional pero recomendada)
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: luxo_web
    restart: always
    ports:
      - "8550:8550"
      - "8553:8553"
    environment:
      # Apunta la conexión al nombre del contenedor de la base de datos
      - DB_HOST=db
      # Activa SSL si montarás tus certificados en producción
      - USE_SSL=false
    depends_on:
      - db

volumes:
  mysql_data:
