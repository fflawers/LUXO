version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: luxo_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: los4valtierra
      MYSQL_DATABASE: sgh_portal
    volumes:
      - ./respaldo_base_de_datos_luxo.sql:/docker-entrypoint-initdb.d/dump.sql
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: luxo_api
    restart: always
    ports:
      - "8553:8553"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=los4valtierra
      - DB_NAME=sgh_portal
    depends_on:
      - db

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: luxo_ui
    restart: always
    ports:
      - "8550:8550"
    environment:
      - API_URL=http://api:8553
      - USE_SSL=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=los4valtierra
      - DB_NAME=sgh_portal
    depends_on:
      - api
    volumes:
      - luxo_uploads:/app/uploads
      - luxo_temp_pdfs:/app/custom_assets/temp_pdfs

volumes:
  mysql_data:
  luxo_uploads:
  luxo_temp_pdfs:
